[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "low-bit-lab"
version = "0.1.0"
description = "Target-agnostic local-first control plane for reproducible low-bit research"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "ruff==0.12.9",
]
remote = [
  "modal==1.5.3",
]

[project.scripts]
lowbit-db = "lowbit_lab.db:main"
lowbit-dry-run = "lowbit_lab.runner:main"
lowbit-manifest = "lowbit_lab.manifest:main"
lowbit-modal-plan = "lowbit_lab.modal_job:main"
lowbit-activate = "lowbit_lab.activation:main"
lowbit-runtime-artifacts = "lowbit_lab.runtime_artifacts:main"
lowbit-controller = "lowbit_lab.controller:main"
lowbit-paid-smoke = "lowbit_lab.provider_smoke:main"
lowbit-reference-transport = "lowbit_lab.reference_transport:main"
lowbit-reference-u8 = "lowbit_lab.reference_orchestrator:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lowbit_lab"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
